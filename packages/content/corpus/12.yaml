  - id: ZY.12.TUAN
    kind: tuan
    text: 否之匪人，不利君子贞，大往小来。则是天地不交而万物不通也，上下不交而天下无邦也。内阴而外阳，内柔而外刚，内小人而外君子，小人道长，君子道消也。
    textTrad: 否之匪人，不利君子貞，大往小來。則是天地不交而萬物不通也，上下不交而天下无邦也。內陰而外陽，內柔而外剛，內小人而外君子，小人道長，君子道消也。
    reviewStatus: imported
  - id: ZY.12.XIANG
    kind: xiang
    text: 天地不交，否；君子以俭德辟难，不可荣以禄。
    textTrad: 天地不交，否；君子以儉德辟難，不可榮以祿。
    reviewStatus: imported
  - id: ZY.12.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初六
    text: 拔茅贞吉，志在君也。
