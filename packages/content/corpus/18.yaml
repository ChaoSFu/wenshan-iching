  - id: ZY.18.TUAN
    kind: tuan
    text: 蛊，刚上而柔下，巽而止，蛊。蛊，元亨，而天下治也。利涉大川，往有事也。先甲三日，后甲三日，终则有始，天行也。
    textTrad: 蠱，剛上而柔下，巽而止，蠱。蠱，元亨，而天下治也。利涉大川，往有事也。先甲三日，後甲三日，終則有始，天行也。
    reviewStatus: imported
  - id: ZY.18.XIANG
    kind: xiang
    text: 山下有风，蛊；君子以振民育德。
    textTrad: 山下有風，蠱；君子以振民育德。
