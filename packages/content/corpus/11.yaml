    text: 小往大来，吉亨。
    textTrad: 小往大來，吉亨。
    reviewStatus: imported
  - id: ZY.11.L1
    kind: yao
    line: 1
    label: 初九
    text: 拔茅茹以其汇，征吉。
    textTrad: 拔茅茹以其彙，征吉。
    reviewStatus: imported
  - id: ZY.11.L2
    kind: yao
    line: 2
    label: 九二
    text: 包荒。用冯河，不遐遗；朋亡。得尚于中行。
    textTrad: 包荒。用馮河，不遐遺；朋亡。得尚于中行。
    reviewStatus: imported
  - id: ZY.11.L3
    kind: yao
    line: 3
    label: 九三
    text: 无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。
    textTrad: 无平不陂，无往不復，艱貞无咎。勿恤其孚，于食有福。
    reviewStatus: imported
  - id: ZY.11.L4
    kind: yao
    line: 4
    label: 六四
    text: 翩翩，不富以其邻；不戒以孚。
    textTrad: 翩翩，不富以其鄰；不戒以孚。
    reviewStatus: imported
  - id: ZY.11.L5
    kind: yao
    line: 5
    label: 六五
    text: 帝乙归妹，以祉，元吉。
    textTrad: 帝乙歸妹，以祉，元吉。
    reviewStatus: imported
  - id: ZY.11.L6
    kind: yao
    line: 6
    label: 上六
    text: 城复于隍，勿用师，自邑告命，贞吝。
    textTrad: 城復于隍，勿用師，自邑告命，貞吝。
    reviewStatus: imported
  - id: ZY.11.TUAN
    kind: tuan
    text: 泰，小往大来，吉亨。则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也。
    textTrad: 泰，小往大來，吉亨。則是天地交而萬物通也，上下交而其志同也。內陽而外陰，內健而外順，內君子而外小人，君子道長，小人道消也。
    reviewStatus: imported
  - id: ZY.11.XIANG
    kind: xiang
    text: 天地交，泰；后以财成天地之道，辅相天地之宜，以左右民。
    textTrad: 天地交，泰；后以財成天地之道，輔相天地之宜，以左右民。
    reviewStatus: imported
  - id: ZY.11.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初九
    text: 拔茅征吉，志在外也。
    textTrad: 拔茅征吉，志在外也。
    reviewStatus: imported
  - id: ZY.11.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 九二
    text: 包荒，得尚于中行，以光大也。
    textTrad: 包荒，得尚于中行，以光大也。
    reviewStatus: imported
  - id: ZY.11.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 九三
    text: 无往不复，天地际也。
    textTrad: 无往不復，天地際也。
    reviewStatus: imported
  - id: ZY.11.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 六四
    text: 翩翩不富，皆失实也。不戒以孚，中心愿也。
    textTrad: 翩翩不富，皆失實也。不戒以孚，中心願也。
    reviewStatus: imported
  - id: ZY.11.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 六五
    text: 以祉，元吉。中以行愿也。
    textTrad: 以祉，元吉。中以行願也。
    reviewStatus: imported
  - id: ZY.11.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上六
    text: 城复于隍，其命乱也。
    textTrad: 城復于隍，其命亂也。
    reviewStatus: imported
