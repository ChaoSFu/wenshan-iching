  - id: ZY.04.L1
    kind: yao
    line: 1
    label: 初六
    text: 发蒙，利用刑人，用说桎梏，以往吝。
    textTrad: 發蒙，利用刑人，用說桎梏，以往吝。
    reviewStatus: imported
  - id: ZY.04.L2
