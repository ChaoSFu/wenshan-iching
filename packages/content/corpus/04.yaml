  - id: ZY.04.L6
    kind: yao
    line: 6
    label: 上九
    text: 击蒙，不利为寇，利御寇。
    textTrad: 擊蒙，不利為寇，利禦寇。
    reviewStatus: imported
  - id: ZY.04.TUAN
    kind: tuan
    text: 蒙，山下有险，险而止，蒙。蒙亨，以亨行，时中也。匪我求童蒙，童蒙求我，志应也。初筮告，以刚中也。再三渎，渎则不告，渎蒙也。蒙以养正，圣功也。
    textTrad: 蒙，山下有險，險而止，蒙。蒙亨，以亨行，時中也。匪我求童蒙，童蒙求我，志應也。初筮告，以剛中也。再三瀆，瀆則不告，瀆蒙也。蒙以養正，聖功也。
    reviewStatus: imported
  - id: ZY.04.XIANG
    kind: xiang
    text: 山下出泉，蒙；君子以果行育德。
    textTrad: 山下出泉，蒙；君子以果行育德。
    reviewStatus: imported
  - id: ZY.04.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初六
    text: 利用刑人，以正法也。
    textTrad: 利用刑人，以正法也。
