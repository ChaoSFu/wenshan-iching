  - id: ZY.42.G
    kind: gua
    label: 益
    text: 利有攸往。利涉大川。
    textTrad: 利有攸往。利涉大川。
    reviewStatus: imported
  - id: ZY.42.L1
    kind: yao
    line: 1
    label: 初九
    text: 利用为大作，元吉，无咎。
    textTrad: 利用為大作，元吉，无咎。
    reviewStatus: imported
  - id: ZY.42.L2
    kind: yao
    line: 2
    label: 六二
    text: 或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。
    textTrad: 或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉。
    reviewStatus: imported
  - id: ZY.42.L3
    kind: yao
    line: 3
    label: 六三
    text: 益之用凶事，无咎。有孚中行，告公用圭。
    textTrad: 益之用凶事，无咎。有孚中行，告公用圭。
    reviewStatus: imported
  - id: ZY.42.L4
    kind: yao
    line: 4
    label: 六四
    text: 中行，告公从。利用为依迁国。
    textTrad: 中行，告公從。利用為依遷國。
    reviewStatus: imported
  - id: ZY.42.L5
    kind: yao
    line: 5
    label: 九五
    text: 有孚惠心，勿问元吉。有孚惠我德。
    textTrad: 有孚惠心，勿問元吉。有孚惠我德。
    reviewStatus: imported
  - id: ZY.42.L6
    kind: yao
    line: 6
    label: 上九
    text: 莫益之，或击之，立心勿恒，凶。
    textTrad: 莫益之，或擊之，立心勿恆，凶。
    reviewStatus: imported
  - id: ZY.42.TUAN
    kind: tuan
    text: 益，损上益下，民说无疆，自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。
    textTrad: 益，損上益下，民說无疆，自上下下，其道大光。利有攸往，中正有慶。利涉大川，木道乃行。益動而巽，日進无疆。天施地生，其益无方。凡益之道，與時偕行。
    reviewStatus: imported
  - id: ZY.42.XIANG
    kind: xiang
    text: 风雷，益；君子以见善则迁，有过则改。
    textTrad: 風雷，益；君子以見善則遷，有過則改。
    reviewStatus: imported
  - id: ZY.42.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初九
    text: 元吉无咎，下不厚事也。
    textTrad: 元吉无咎，下不厚事也。
    reviewStatus: imported
  - id: ZY.42.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 六二
    text: 或益之，自外来也。
    textTrad: 或益之，自外來也。
    reviewStatus: imported
  - id: ZY.42.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 六三
    text: 益用凶事，固有之也。
    textTrad: 益用凶事，固有之也。
    reviewStatus: imported
  - id: ZY.42.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 六四
    text: 告公从，以益志也。
    textTrad: 告公從，以益志也。
    reviewStatus: imported
  - id: ZY.42.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 九五
    text: 有孚惠心，勿问之矣。惠我德，大得志也。
    textTrad: 有孚惠心，勿問之矣。惠我德，大得志也。
    reviewStatus: imported
  - id: ZY.42.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上九
    text: 莫益之，偏辞也。或击之，自外来也。
    textTrad: 莫益之，偏辭也。或擊之，自外來也。
    reviewStatus: imported
