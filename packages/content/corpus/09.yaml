  - id: ZY.09.L6
    kind: yao
    line: 6
    label: 上九
    text: 既雨既处，尚得载，妇贞厉，月几望，君子征凶。
    textTrad: 既雨既處，尚得載，婦貞厲，月幾望，君子征凶。
    reviewStatus: imported
  - id: ZY.09.TUAN
    kind: tuan
    text: 小畜，柔得位而上下应之，曰小畜。健而巽，刚中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也。
    textTrad: 小畜，柔得位而上下應之，曰小畜。健而巽，剛中而志行，乃亨。密雲不雨，尚往也。自我西郊，施未行也。
    reviewStatus: imported
  - id: ZY.09.XIANG
    kind: xiang
    text: 风行天上，小畜，君子以懿文德。
    textTrad: 風行天上，小畜，君子以懿文德。
    reviewStatus: imported
  - id: ZY.09.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初九
    text: 复自道，其义吉也。
    textTrad: 復自道，其義吉也。
