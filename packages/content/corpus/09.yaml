  - id: ZY.09.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 九五
    text: 有孚挛如，不独富也。
    textTrad: 有孚攣如，不獨富也。
    reviewStatus: imported
  - id: ZY.09.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上九
    text: 既雨既处，德积载也。君子征凶，有所疑也。
    textTrad: 既雨既處，德積載也。君子征凶，有所疑也。
