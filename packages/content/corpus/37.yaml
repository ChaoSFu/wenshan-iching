  - id: ZY.37.TUAN
    kind: tuan
    text: 家人，女正位乎内，男正位乎外，男女正，天地之大义也。家人有严君焉，父母之谓也。父父，子子，兄兄，弟弟，夫夫，妇妇，而家道正；正家而天下定矣。
    textTrad: 家人，女正位乎內，男正位乎外，男女正，天地之大義也。家人有嚴君焉，父母之謂也。父父，子子，兄兄，弟弟，夫夫，婦婦，而家道正；正家而天下定矣。
    reviewStatus: imported
  - id: ZY.37.XIANG
    kind: xiang
    text: 风自火出，家人；君子以言有物，而行有恒。
    textTrad: 風自火出，家人；君子以言有物，而行有恆。
    reviewStatus: imported
  - id: ZY.37.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初九
    text: 闲有家，志未变也。
    textTrad: 閑有家，志未變也。
    reviewStatus: imported
  - id: ZY.37.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 六二
    text: 六二之吉，顺以巽也。
    textTrad: 六二之吉，順以巽也。
    reviewStatus: imported
  - id: ZY.37.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 九三
    text: 家人嗃嗃，未失也；妇子嘻嘻，失家节也。
    textTrad: 家人嗃嗃，未失也；婦子嘻嘻，失家節也。
    reviewStatus: imported
  - id: ZY.37.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 六四
    text: 富家大吉，顺在位也。
    textTrad: 富家大吉，順在位也。
    reviewStatus: imported
  - id: ZY.37.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 九五
    text: 王假有家，交相爱也。
    textTrad: 王假有家，交相愛也。
    reviewStatus: imported
  - id: ZY.37.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上九
    text: 威如之吉，反身之谓也。
    textTrad: 威如之吉，反身之謂也。
