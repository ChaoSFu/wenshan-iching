entries:
  - id: ZY.06.G
    kind: gua
    label: 讼
    text: 有孚，窒，惕，中吉，终凶。利见大人，不利涉大川。
    textTrad: 有孚，窒，惕，中吉，終凶。利見大人，不利涉大川。
    reviewStatus: imported
  - id: ZY.06.L1
    kind: yao
    line: 1
    label: 初六
    text: 不永所事，小有言，终吉。
    textTrad: 不永所事，小有言，終吉。
    reviewStatus: imported
  - id: ZY.06.L2
    kind: yao
    line: 2
    label: 九二
    text: 不克讼，归而逋，其邑人三百户无眚。
    textTrad: 不克訟，歸而逋，其邑人三百戶无眚。
    reviewStatus: imported
  - id: ZY.06.L3
    kind: yao
    line: 3
    label: 六三
    text: 食旧德，贞厉，终吉。或从王事，无成。
    textTrad: 食舊德，貞厲，終吉。或從王事，无成。
    reviewStatus: imported
  - id: ZY.06.L4
    kind: yao
    line: 4
    label: 九四
    text: 不克讼，复即命渝，安贞吉。
    textTrad: 不克訟，復即命渝，安貞吉。
    reviewStatus: imported
  - id: ZY.06.L5
    kind: yao
    line: 5
    label: 九五
    text: 讼，元吉。
    textTrad: 訟，元吉。
    reviewStatus: imported
  - id: ZY.06.L6
    kind: yao
    line: 6
    label: 上九
    text: 或锡之鞶带，终朝三褫之。
    textTrad: 或錫之鞶帶，終朝三褫之。
    reviewStatus: imported
  - id: ZY.06.TUAN
    kind: tuan
    text: 讼，上刚下险，险而健，讼。讼，有孚，窒，惕，中吉，刚来而得中也。终凶，讼不可成也。利见大人，尚中正也。不利涉大川，入于渊也。
    textTrad: 訟，上剛下險，險而健，訟。訟，有孚，窒，惕，中吉，剛來而得中也。終凶，訟不可成也。利見大人，尚中正也。不利涉大川，入于淵也。
    reviewStatus: imported
  - id: ZY.06.XIANG
    kind: xiang
    text: 天与水违行，讼；君子以作事谋始。
    textTrad: 天與水違行，訟；君子以作事謀始。
    reviewStatus: imported
  - id: ZY.06.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初六
    text: 不永所事，讼不可长也。虽小有言，其辩明也。
    textTrad: 不永所事，訟不可長也。雖小有言，其辯明也。
    reviewStatus: imported
  - id: ZY.06.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 九二
    text: 不克讼，归逋窜也。自下讼上，患至掇也。
    textTrad: 不克訟，歸逋竄也。自下訟上，患至掇也。
    reviewStatus: imported
  - id: ZY.06.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 六三
    text: 食旧德，从上吉也。
    textTrad: 食舊德，從上吉也。
    reviewStatus: imported
  - id: ZY.06.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 九四
    text: 复即命渝，安贞，不失也。
    textTrad: 復即命渝，安貞，不失也。
    reviewStatus: imported
  - id: ZY.06.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 九五
    text: 讼，元吉，以中正也。
    textTrad: 訟，元吉，以中正也。
    reviewStatus: imported
  - id: ZY.06.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上九
    text: 以讼受服，亦不足敬也。
    textTrad: 以訟受服，亦不足敬也。
    reviewStatus: imported
