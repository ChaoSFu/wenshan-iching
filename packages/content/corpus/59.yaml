  - id: ZY.59.TUAN
    kind: tuan
    text: 涣，亨。刚来而不穷，柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也。
    textTrad: 渙，亨。剛來而不窮，柔得位乎外而上同。王假有廟，王乃在中也。利涉大川，乘木有功也。
    reviewStatus: imported
  - id: ZY.59.XIANG
    kind: xiang
    text: 风行水上，涣；先王以享于帝立庙。
    textTrad: 風行水上，渙；先王以享于帝立廟。
    reviewStatus: imported
