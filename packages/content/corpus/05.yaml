  - id: ZY.05.TUAN
    kind: tuan
    text: 需，须也，险在前也；刚健而不陷，其义不困穷矣。需，有孚，光亨，贞吉，位乎天位，以正中也。利涉大川，往有功也。
    textTrad: 需，須也，險在前也；剛健而不陷，其義不困窮矣。需，有孚，光亨，貞吉，位乎天位，以正中也。利涉大川，往有功也。
    reviewStatus: imported
  - id: ZY.05.XIANG
    kind: xiang
    text: 云上于天，需；君子以饮食宴乐。
    textTrad: 雲上於天，需；君子以飲食宴樂。
    reviewStatus: imported
  - id: ZY.05.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初九
    text: 需于郊，不犯难行也。利用恒，无咎，未失常也。
    textTrad: 需于郊，不犯難行也。利用恆，无咎，未失常也。
    reviewStatus: imported
  - id: ZY.05.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 九二
    text: 需于沙，衍在中也。虽小有言，以吉终也。
    textTrad: 需于沙，衍在中也。雖小有言，以吉終也。
    reviewStatus: imported
  - id: ZY.05.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 九三
    text: 需于泥，灾在外也。自我致寇，敬慎不败也。
    textTrad: 需于泥，災在外也。自我致寇，敬慎不敗也。
    reviewStatus: imported
  - id: ZY.05.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 六四
    text: 需于血，顺以听也。
    textTrad: 需于血，順以聽也。
    reviewStatus: imported
  - id: ZY.05.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 九五
    text: 酒食，贞吉，以中正也。
    textTrad: 酒食，貞吉，以中正也。
    reviewStatus: imported
  - id: ZY.05.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上六
    text: 不速之客来，敬之终吉。虽不当位，未大失也。
    textTrad: 不速之客來，敬之終吉。雖不當位，未大失也。
