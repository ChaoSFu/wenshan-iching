entries:
  - id: ZY.17.G
    kind: gua
    label: 随
    text: 元亨。利贞。无咎。
    textTrad: 元亨。利貞。无咎。
    reviewStatus: imported
  - id: ZY.17.L1
    kind: yao
    line: 1
    label: 初九
    text: 官有渝，贞吉。出门交有功。
    textTrad: 官有渝，貞吉。出門交有功。
    reviewStatus: imported
  - id: ZY.17.L2
    kind: yao
    line: 2
    label: 六二
    text: 系小子，失丈夫。
    textTrad: 係小子，失丈夫。
    reviewStatus: imported
  - id: ZY.17.L3
    kind: yao
    line: 3
    label: 六三
    text: 系丈夫，失小子。随，有求得利，居贞。
    textTrad: 係丈夫，失小子。隨，有求得利，居貞。
    reviewStatus: imported
  - id: ZY.17.L4
    kind: yao
    line: 4
    label: 九四
    text: 随有获，贞凶。有孚在道，以明，何咎。
    textTrad: 隨有獲，貞凶。有孚在道，以明，何咎。
    reviewStatus: imported
  - id: ZY.17.L5
    kind: yao
    line: 5
    label: 九五
    text: 孚于嘉，吉。
    textTrad: 孚于嘉，吉。
    reviewStatus: imported
  - id: ZY.17.L6
    kind: yao
    line: 6
    label: 上六
    text: 拘系之，乃从维之。王用亨于西山。
    textTrad: 拘係之，乃從維之。王用亨于西山。
    reviewStatus: imported
  - id: ZY.17.TUAN
    kind: tuan
    text: 随，刚来而下柔，动而说，随。大亨贞，无咎，而天下随时，随时之义大矣哉！
    textTrad: 隨，剛來而下柔，動而說，隨。大亨貞，无咎，而天下隨時，隨時之義大矣哉！
    reviewStatus: imported
  - id: ZY.17.XIANG
    kind: xiang
    text: 泽中有雷，随；君子以向晦入宴息。
    textTrad: 澤中有雷，隨；君子以嚮晦入宴息。
    reviewStatus: imported
  - id: ZY.17.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初九
    text: 官有渝，从正吉也。出门交有功，不失也。
    textTrad: 官有渝，從正吉也。出門交有功，不失也。
    reviewStatus: imported
  - id: ZY.17.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 六二
    text: 系小子，弗兼与也。
    textTrad: 系小子，弗兼與也。
    reviewStatus: imported
  - id: ZY.17.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 六三
    text: 系丈夫，志舍下也。
    textTrad: 系丈夫，志舍下也。
    reviewStatus: imported
  - id: ZY.17.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 九四
    text: 随有获，其义凶也。有孚在道，明功也。
    textTrad: 隨有獲，其義凶也。有孚在道，明功也。
    reviewStatus: imported
  - id: ZY.17.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 九五
    text: 孚于嘉，吉；位正中也。
    textTrad: 孚于嘉，吉；位正中也。
    reviewStatus: imported
  - id: ZY.17.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上六
    text: 拘系之，上穷也。
    textTrad: 拘系之，上窮也。
    reviewStatus: imported
