  - id: ZY.19.TUAN
    kind: tuan
    text: 临，刚浸而长。说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。
    textTrad: 臨，剛浸而長。說而順，剛中而應，大亨以正，天之道也。至于八月有凶，消不久也。
    reviewStatus: imported
  - id: ZY.19.XIANG
    kind: xiang
    text: 泽上有地，临；君子以教思无穷，容保民无疆。
    textTrad: 澤上有地，臨；君子以教思无窮，容保民无疆。
    reviewStatus: imported
