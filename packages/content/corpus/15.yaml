  - id: ZY.15.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 六四
    text: 无不利㧑谦；不违则也。
    textTrad: 无不利撝謙；不違則也。
    reviewStatus: imported
  - id: ZY.15.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 六五
    text: 利用侵伐，征不服也。
    textTrad: 利用侵伐，征不服也。
    reviewStatus: imported
  - id: ZY.15.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上六
    text: 鸣谦，志未得也。可用行师，征邑国也。
    textTrad: 鳴謙，志未得也。可用行師，征邑國也。
