  - id: ZY.15.TUAN
    kind: tuan
    text: 谦，亨，天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也。
    textTrad: 謙，亨，天道下濟而光明，地道卑而上行。天道虧盈而益謙，地道變盈而流謙，鬼神害盈而福謙，人道惡盈而好謙。謙尊而光，卑而不可逾，君子之終也。
    reviewStatus: imported
  - id: ZY.15.XIANG
    kind: xiang
    text: 地中有山，谦；君子以裒多益寡，称物平施。
    textTrad: 地中有山，謙；君子以裒多益寡，稱物平施。
    reviewStatus: imported
  - id: ZY.15.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初六
    text: 谦谦君子，卑以自牧也。
    textTrad: 謙謙君子，卑以自牧也。
    reviewStatus: imported
  - id: ZY.15.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 六二
    text: 鸣谦贞吉，中心得也。
