  - id: ZY.61.L1
    kind: yao
    line: 1
    label: 初九
    text: 虞吉，有它不燕。
    textTrad: 虞吉，有它不燕。
    reviewStatus: imported
  - id: ZY.61.L2
    kind: yao
    line: 2
    label: 九二
    text: 鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。
    textTrad: 鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。
    reviewStatus: imported
  - id: ZY.61.L3
    kind: yao
    line: 3
    label: 六三
    text: 得敌，或鼓或罢，或泣或歌。
    textTrad: 得敵，或鼓或罷，或泣或歌。
    reviewStatus: imported
  - id: ZY.61.L4
    kind: yao
    line: 4
    label: 六四
    text: 月既望，马匹亡，无咎。
    textTrad: 月既望，馬匹亡，无咎。
    reviewStatus: imported
  - id: ZY.61.L5
    kind: yao
    line: 5
    label: 九五
    text: 有孚挛如，无咎。
    textTrad: 有孚攣如，无咎。
    reviewStatus: imported
  - id: ZY.61.L6
    kind: yao
    line: 6
    label: 上九
    text: 翰音登于天，贞凶。
    textTrad: 翰音登于天，貞凶。
    reviewStatus: imported
  - id: ZY.61.TUAN
    kind: tuan
    text: 中孚，柔在内而刚得中。说而巽，孚，乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也。
    textTrad: 中孚，柔在內而剛得中。說而巽，孚，乃化邦也。豚魚吉，信及豚魚也。利涉大川，乘木舟虛也。中孚以利貞，乃應乎天也。
    reviewStatus: imported
  - id: ZY.61.XIANG
    kind: xiang
    text: 泽上有风，中孚；君子以议狱缓死。
    textTrad: 澤上有風，中孚；君子以議獄緩死。
    reviewStatus: imported
  - id: ZY.61.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初九
    text: 初九虞吉，志未变也。
    textTrad: 初九虞吉，志未變也。
    reviewStatus: imported
  - id: ZY.61.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 九二
    text: 其子和之，中心愿也。
    textTrad: 其子和之，中心愿也。
    reviewStatus: imported
  - id: ZY.61.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 六三
    text: 可鼓或罢，位不当也。
    textTrad: 可鼓或罷，位不當也。
    reviewStatus: imported
  - id: ZY.61.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 六四
    text: 马匹亡，绝类上也。
    textTrad: 馬匹亡，絕類上也。
    reviewStatus: imported
  - id: ZY.61.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 九五
    text: 有孚挛如，位正当也。
    textTrad: 有孚攣如，位正當也。
    reviewStatus: imported
  - id: ZY.61.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上九
    text: 翰音登于天，何可长也。
    textTrad: 翰音登于天，何可長也。
    reviewStatus: imported
