  - id: ZY.02.WY
    kind: wenyan
    text: |-
      坤至柔而动也刚，至静而德方。后得主而有常，含万物而化光。坤道其顺乎！承天而时行。
      积善之家，必有馀庆；积不善之家，必有馀殃。臣弑其君，子弑其父，非一朝一夕之故，其所由来者渐矣。由辨之不早辨也。易曰：“履霜，坚冰至。”盖言顺也。
      直其正也，方其义也。君子敬以直内，义以方外，敬义立而德不孤。“直方大，不习无不利。”则不疑其所行也。
      阴虽有美，含之。以从王事，弗敢成也。地道也，妻道也，臣道也。地道无成，而代有终也。
      天地变化，草木蕃；天地闭，贤人隐。易曰：“括囊，无咎，无誉。”盖言谨也。
      君子黄中通理，正位居体，美在其中，而畅于四支，发于事业，美之至也。
      阴疑于阳必战，为其嫌于无阳也，故称龙焉。犹未离其类也，故称血焉。夫玄黄者，天地之杂也。天玄而地黄。
    textTrad: |-
      坤至柔而動也剛，至靜而德方。後得主而有常，含萬物而化光。坤道其順乎！承天而時行。
      積善之家，必有餘慶；積不善之家，必有餘殃。臣弒其君，子弒其父，非一朝一夕之故，其所由來者漸矣。由辨之不早辨也。易曰：「履霜，堅冰至。」蓋言順也。
      直其正也，方其義也。君子敬以直內，義以方外，敬義立而德不孤。「直方大，不習无不利。」則不疑其所行也。
      陰雖有美，含之。以從王事，弗敢成也。地道也，妻道也，臣道也。地道无成，而代有終也。
      天地變化，草木蕃；天地閉，賢人隱。易曰：「括囊，无咎，无譽。」蓋言謹也。
      君子黃中通理，正位居體，美在其中，而暢於四支，發於事業，美之至也。
      陰疑於陽必戰，為其嫌於无陽也，故稱龍焉。猶未離其類也，故稱血焉。夫玄黃者，天地之雜也。天玄而地黃。
    reviewStatus: imported
