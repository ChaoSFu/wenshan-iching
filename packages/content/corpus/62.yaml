  - id: ZY.62.G
    kind: gua
    label: 小过
    text: 亨。利贞。可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。
    textTrad: 亨。利貞。可小事，不可大事。飛鳥遺之音，不宜上宜下，大吉。
    reviewStatus: imported
  - id: ZY.62.L1
    kind: yao
    line: 1
    label: 初六
    text: 飞鸟以凶。
    textTrad: 飛鳥以凶。
    reviewStatus: imported
  - id: ZY.62.L2
    kind: yao
    line: 2
    label: 六二
    text: 过其祖，遇其妣；不及其君，遇其臣；无咎。
    textTrad: 過其祖，遇其妣；不及其君，遇其臣；无咎。
    reviewStatus: imported
  - id: ZY.62.L3
    kind: yao
    line: 3
    label: 九三
    text: 弗过防之，从或戕之，凶。
    textTrad: 弗過防之，從或戕之，凶。
    reviewStatus: imported
  - id: ZY.62.L4
    kind: yao
    line: 4
    label: 九四
    text: 无咎，弗过遇之。往厉必戒，勿用永贞。
    textTrad: 无咎，弗過遇之。往厲必戒，勿用永貞。
    reviewStatus: imported
  - id: ZY.62.L5
    kind: yao
    line: 5
    label: 六五
    text: 密云不雨，自我西郊，公弋取彼在穴。
    textTrad: 密雲不雨，自我西郊，公弋取彼在穴。
    reviewStatus: imported
  - id: ZY.62.L6
    kind: yao
    line: 6
    label: 上六
    text: 弗遇过之，飞鸟离之，凶，是谓灾眚。
    textTrad: 弗遇過之，飛鳥離之，凶，是謂災眚。
    reviewStatus: imported
  - id: ZY.62.TUAN
    kind: tuan
    text: 小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉，有飞鸟遗之音，不宜上宜下，大吉；上逆而下顺也。
    textTrad: 小過，小者過而亨也。過以利貞，與時行也。柔得中，是以小事吉也。剛失位而不中，是以不可大事也。有飛鳥之象焉，有飛鳥遺之音，不宜上宜下，大吉；上逆而下順也。
    reviewStatus: imported
  - id: ZY.62.XIANG
    kind: xiang
    text: 山上有雷，小过；君子以行过乎恭，丧过乎哀，用过乎俭。
    textTrad: 山上有雷，小過；君子以行過乎恭，喪過乎哀，用過乎儉。
    reviewStatus: imported
  - id: ZY.62.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初六
    text: 飞鸟以凶，不可如何也。
    textTrad: 飛鳥以凶，不可如何也。
    reviewStatus: imported
  - id: ZY.62.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 六二
    text: 不及其君，臣不可过也。
    textTrad: 不及其君，臣不可過也。
    reviewStatus: imported
  - id: ZY.62.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 九三
    text: 从或戕之，凶如何也。
    textTrad: 從或戕之，凶如何也。
    reviewStatus: imported
  - id: ZY.62.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 九四
    text: 弗过遇之，位不当也。往厉必戒，终不可长也。
    textTrad: 弗過遇之，位不當也。往厲必戒，終不可長也。
    reviewStatus: imported
  - id: ZY.62.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 六五
    text: 密云不雨，已上也。
    textTrad: 密云不雨，已上也。
    reviewStatus: imported
  - id: ZY.62.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上六
    text: 弗遇过之，已亢也。
    textTrad: 弗遇過之，已亢也。
