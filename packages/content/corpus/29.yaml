  - id: ZY.29.L4
    kind: yao
    line: 4
    label: 六四
    text: 尊酒簋，贰用缶。内约自牖，终无咎。
    textTrad: 尊酒簋，貳用缶。内約自牖，終无咎。
    reviewStatus: imported
  - id: ZY.29.L5
    kind: yao
    line: 5
    label: 九五
    text: 坎不盈，禔既平，无咎。
    textTrad: 坎不盈，禔既平，无咎。
    reviewStatus: imported
  - id: ZY.29.L6
    kind: yao
    line: 6
    label: 上六
    text: 系用徽𬙊，寘于丛棘，三岁不得，凶。
    textTrad: 係用徽纆，寘于叢棘，三歲不得，凶。
    reviewStatus: imported
  - id: ZY.29.TUAN
    kind: tuan
    text: 习坎，重险也。水流而不盈，行险而不失其信。维心亨，乃以刚中也。行有尚，往有功也。天险不可升也，地险山川丘陵也，王公设险以守其国，坎之时用大矣哉！
    textTrad: 習坎，重險也。水流而不盈，行險而不失其信。維心亨，乃以剛中也。行有尚，往有功也。天險不可升也，地險山川丘陵也，王公設險以守其國，坎之時用大矣哉！
    reviewStatus: imported
  - id: ZY.29.XIANG
    kind: xiang
    text: 水洊至，习坎；君子以常德行，习教事。
    textTrad: 水洊至，習坎；君子以常德行，習教事。
    reviewStatus: imported
