    line: 6
    label: 上九
    text: 白贲，无咎。
    textTrad: 白賁，无咎。
    reviewStatus: imported
  - id: ZY.22.TUAN
    kind: tuan
    text: 贲，亨；柔来而文刚，故亨。分刚上而文柔，故小利有攸往。刚柔交错，天文也；文明以止，人文也。观乎天文，以察时变；观乎人文，以化成天下。
    textTrad: 賁，亨；柔來而文剛，故亨。分剛上而文柔，故小利有攸往。剛柔交錯，天文也；文明以止，人文也。觀乎天文，以察時變；觀乎人文，以化成天下。
    reviewStatus: imported
  - id: ZY.22.XIANG
    kind: xiang
    text: 山下有火，贲；君子以明庶政，无敢折狱。
    textTrad: 山下有火，賁；君子以明庶政，无敢折獄。
    reviewStatus: imported
  - id: ZY.22.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初九
    text: 舍车而徒，义弗乘也。
    textTrad: 舍車而徒，義弗乘也。
