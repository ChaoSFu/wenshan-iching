    line: 4
    label: 六四
    text: 六四，当位疑也。匪寇婚媾，终无尤也。
    textTrad: 六四，當位疑也。匪寇婚媾，終无尤也。
    reviewStatus: imported
  - id: ZY.22.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 六五
    text: 六五之吉，有喜也。
    textTrad: 六五之吉，有喜也。
