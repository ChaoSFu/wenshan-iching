  - id: ZY.16.L6
    kind: yao
    line: 6
    label: 上六
    text: 冥豫，成有渝，无咎。
    textTrad: 冥豫，成有渝，无咎。
    reviewStatus: imported
  - id: ZY.16.TUAN
    kind: tuan
    text: 豫，刚应而志行，顺以动，豫。豫，顺以动，故天地如之，而况建侯行师乎？天地以顺动，故日月不过，而四时不忒；圣人以顺动，则刑罚清而民服。豫之时义大矣哉！
    textTrad: 豫，剛應而志行，順以動，豫。豫，順以動，故天地如之，而況建侯行師乎？天地以順動，故日月不過，而四時不忒；聖人以順動，則刑罰清而民服。豫之時義大矣哉！
    reviewStatus: imported
  - id: ZY.16.XIANG
    kind: xiang
    text: 雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。
    textTrad: 雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。
    reviewStatus: imported
  - id: ZY.16.L1.XIANG
