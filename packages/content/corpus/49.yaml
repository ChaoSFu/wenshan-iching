  - id: ZY.49.TUAN
    kind: tuan
    text: 革，水火相息，二女同居，其志不相得，曰革。已日乃孚；革而信也。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成，汤武革命，顺乎天而应乎人，革之时义大矣哉！
    textTrad: 革，水火相息，二女同居，其志不相得，曰革。已日乃孚；革而信也。文明以說，大亨以正，革而當，其悔乃亡。天地革而四時成，湯武革命，順乎天而應乎人，革之時義大矣哉！
    reviewStatus: imported
  - id: ZY.49.XIANG
    kind: xiang
    text: 泽中有火，革；君子以治历明时。
    textTrad: 澤中有火，革；君子以治歷明時。
    reviewStatus: imported
  - id: ZY.49.L1.XIANG
