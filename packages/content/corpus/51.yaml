    label: 震
    text: 亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。
    textTrad: 亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。
    reviewStatus: imported
  - id: ZY.51.L1
    kind: yao
    line: 1
    label: 初九
    text: 震来虩虩，后笑言哑哑，吉。
    textTrad: 震來虩虩，後笑言啞啞，吉。
    reviewStatus: imported
  - id: ZY.51.L2
    kind: yao
    line: 2
    label: 六二
    text: 震来厉，亿丧贝，跻于九陵，勿逐，七日得。
    textTrad: 震來厲，億喪貝，躋于九陵，勿逐，七日得。
    reviewStatus: imported
