    line: 5
    label: 六五
    text: 震往来厉，亿无丧，有事。
    textTrad: 震往來厲，億无喪，有事。
    reviewStatus: imported
  - id: ZY.51.L6
    kind: yao
    line: 6
    label: 上六
    text: 震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。
    textTrad: 震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言。
    reviewStatus: imported
  - id: ZY.51.TUAN
    kind: tuan
    text: 震，亨。震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出可以守宗庙社稷，以为祭主也。
    textTrad: 震，亨。震來虩虩，恐致福也。笑言啞啞，後有則也。震驚百里，驚遠而懼邇也。出可以守宗廟社稷，以為祭主也。
    reviewStatus: imported
  - id: ZY.51.XIANG
    kind: xiang
    text: 洊雷，震；君子以恐惧修省。
    textTrad: 洊雷，震；君子以恐懼修省。
    reviewStatus: imported
