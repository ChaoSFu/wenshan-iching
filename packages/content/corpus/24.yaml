    label: 上六
    text: 迷复，凶，有灾眚。用行师，终有大败，以其国君，凶；至于十年，不克征。
    textTrad: 迷復，凶，有災眚。用行師，終有大敗，以其國君，凶；至于十年，不克征。
    reviewStatus: imported
  - id: ZY.24.TUAN
    kind: tuan
    text: 复亨；刚反，动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复其见天地之心乎？
    textTrad: 復亨；剛反，動而以順行，是以出入无疾，朋來无咎。反復其道，七日來復，天行也。利有攸往，剛長也。復其見天地之心乎？
    reviewStatus: imported
  - id: ZY.24.XIANG
    kind: xiang
    text: 雷在地中，复；先王以至日闭关，商旅不行，后不省方。
    textTrad: 雷在地中，復；先王以至日閉關，商旅不行，后不省方。
    reviewStatus: imported
