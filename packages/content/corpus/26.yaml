  - id: ZY.26.TUAN
    kind: tuan
    text: 大畜，刚健笃实辉光，日新其德，刚上而尚贤。能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也。
    textTrad: 大畜，剛健篤實輝光，日新其德，剛上而尚賢。能止健，大正也。不家食吉，養賢也。利涉大川，應乎天也。
    reviewStatus: imported
  - id: ZY.26.XIANG
    kind: xiang
    text: 天在山中，大畜；君子以多识前言往行，以畜其德。
    textTrad: 天在山中，大畜；君子以多識前言往行，以畜其德。
    reviewStatus: imported
