    text: 履虎尾，愬愬终吉。
    textTrad: 履虎尾，愬愬終吉。
    reviewStatus: imported
  - id: ZY.10.L5
    kind: yao
    line: 5
    label: 九五
    text: 夬履，贞厉。
    textTrad: 夬履，貞厲。
