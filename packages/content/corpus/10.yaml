  - id: ZY.10.L3
    kind: yao
    line: 3
    label: 六三
    text: 眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。
    textTrad: 眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。
    reviewStatus: imported
  - id: ZY.10.L4
    kind: yao
