  - id: ZY.46.TUAN
    kind: tuan
    text: 柔以时升，巽而顺，刚中而应，是以大亨。用见大人，勿恤；有庆也。南征吉，志行也。
    textTrad: 柔以時升，巽而順，剛中而應，是以大亨。用見大人，勿恤；有慶也。南征吉，志行也。
    reviewStatus: imported
