  - id: ZY.13.TUAN
    kind: tuan
    text: 同人，柔得位得中，而应乎乾，曰同人。同人曰，同人于野，亨。利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。
    textTrad: 同人，柔得位得中，而應乎乾，曰同人。同人曰，同人于野，亨。利涉大川，乾行也。文明以健，中正而應，君子正也。唯君子為能通天下之志。
    reviewStatus: imported
  - id: ZY.13.XIANG
    kind: xiang
    text: 天与火，同人；君子以类族辨物。
    textTrad: 天與火，同人；君子以類族辨物。
    reviewStatus: imported
  - id: ZY.13.L1.XIANG
