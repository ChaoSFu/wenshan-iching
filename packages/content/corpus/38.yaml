    reviewStatus: imported
  - id: ZY.38.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 六三
    text: 见舆曳，位不当也。无初有终，遇刚也。
    textTrad: 見輿曳，位不當也。无初有終，遇剛也。
    reviewStatus: imported
  - id: ZY.38.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 九四
    text: 交孚无咎，志行也。
    textTrad: 交孚无咎，志行也。
    reviewStatus: imported
  - id: ZY.38.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 六五
    text: 厥宗噬肤，往有庆也。
    textTrad: 厥宗噬膚，往有慶也。
    reviewStatus: imported
  - id: ZY.38.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上九
    text: 遇雨之吉，群疑亡也。
    textTrad: 遇雨之吉，群疑亡也。
