  - id: ZY.40.L2
    kind: yao
    line: 2
    label: 九二
    text: 田获三狐，得黄矢，贞吉。
    textTrad: 田獲三狐，得黃矢，貞吉。
    reviewStatus: imported
  - id: ZY.40.L3
    kind: yao
