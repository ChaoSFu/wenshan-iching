    label: 六三
    text: 负且乘，致寇至，贞吝。
    textTrad: 負且乘，致寇至，貞吝。
    reviewStatus: imported
  - id: ZY.40.L4
    kind: yao
    line: 4
    label: 九四
    text: 解而拇，朋至斯孚。
    textTrad: 解而拇，朋至斯孚。
    reviewStatus: imported
  - id: ZY.40.L5
    kind: yao
    line: 5
    label: 六五
    text: 君子惟有解，吉；有孚于小人。
    textTrad: 君子惟有解，吉；有孚于小人。
    reviewStatus: imported
  - id: ZY.40.L6
