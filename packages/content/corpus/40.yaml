    line: 6
    label: 上六
    text: 公用射隼，于高墉之上，获之，无不利。
    textTrad: 公用射隼，于高墉之上，獲之，无不利。
    reviewStatus: imported
  - id: ZY.40.TUAN
    kind: tuan
    text: 解，险以动，动而免乎险，解。解利西南，往得众也。其来复吉，乃得中也。有攸往夙吉，往有功也。天地解，而雷雨作，雷雨作，而百果草木皆甲坼，解之时义大矣哉！
    textTrad: 解，險以動，動而免乎險，解。解利西南，往得眾也。其來復吉，乃得中也。有攸往夙吉，往有功也。天地解，而雷雨作，雷雨作，而百果草木皆甲坼，解之時義大矣哉！
    reviewStatus: imported
  - id: ZY.40.XIANG
    kind: xiang
    text: 雷雨作，解；君子以赦过宥罪。
    textTrad: 雷雨作，解；君子以赦過宥罪。
    reviewStatus: imported
  - id: ZY.40.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初六
    text: 刚柔之际，义无咎也。
    textTrad: 剛柔之際，義无咎也。
    reviewStatus: imported
  - id: ZY.40.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 九二
    text: 九二贞吉，得中道也。
    textTrad: 九二貞吉，得中道也。
    reviewStatus: imported
  - id: ZY.40.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 六三
    text: 负且乘，亦可丑也，自我致戎，又谁咎也。
    textTrad: 負且乘，亦可丑也，自我致戎，又誰咎也。
    reviewStatus: imported
  - id: ZY.40.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 九四
    text: 解而拇，未当位也。
    textTrad: 解而拇，未當位也。
    reviewStatus: imported
  - id: ZY.40.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 六五
    text: 君子有解，小人退也。
    textTrad: 君子有解，小人退也。
    reviewStatus: imported
  - id: ZY.40.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上六
