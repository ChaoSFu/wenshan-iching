entries:
  - id: ZY.55.G
    kind: gua
    label: 丰
    text: 亨。王假之，勿忧，宜日中。
    textTrad: 亨。王假之，勿憂，宜日中。
    reviewStatus: imported
  - id: ZY.55.L1
    kind: yao
    line: 1
    label: 初九
    text: 遇其配主，虽旬无咎，往有尚。
    textTrad: 遇其配主，雖旬无咎，往有尚。
    reviewStatus: imported
  - id: ZY.55.L2
    kind: yao
    line: 2
    label: 六二
    text: 丰其蔀，日中见斗，往得疑疾，有孚发若，吉。
    textTrad: 豐其蔀，日中見斗，往得疑疾，有孚發若，吉。
    reviewStatus: imported
  - id: ZY.55.L3
    kind: yao
    line: 3
    label: 九三
    text: 丰其沛，日中见沬，折其右肱，无咎。
    textTrad: 豐其沛，日中見沬，折其右肱，无咎。
    reviewStatus: imported
  - id: ZY.55.L4
    kind: yao
    line: 4
    label: 九四
    text: 丰其蔀，日中见斗，遇其夷主，吉。
    textTrad: 豐其蔀，日中見斗，遇其夷主，吉。
    reviewStatus: imported
  - id: ZY.55.L5
    kind: yao
    line: 5
    label: 六五
    text: 来章，有庆誉，吉。
    textTrad: 來章，有慶譽，吉。
    reviewStatus: imported
  - id: ZY.55.L6
    kind: yao
    line: 6
    label: 上六
    text: 丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。
    textTrad: 豐其屋，蔀其家，窺其戶，闃其无人，三歲不觌，凶。
    reviewStatus: imported
  - id: ZY.55.TUAN
    kind: tuan
    text: 丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食，天地盈虚，与时消息，而况于人乎？况于鬼神乎？
    textTrad: 豐，大也。明以動，故豐。王假之，尚大也。勿憂宜日中，宜照天下也。日中則昃，月盈則食，天地盈虛，與時消息，而況于人乎？況于鬼神乎？
    reviewStatus: imported
  - id: ZY.55.XIANG
    kind: xiang
    text: 雷电皆至，丰；君子以折狱致刑。
    textTrad: 雷電皆至，豐；君子以折獄致刑。
    reviewStatus: imported
  - id: ZY.55.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初九
    text: 虽旬无咎，过旬灾也。
    textTrad: 雖旬无咎，過旬災也。
    reviewStatus: imported
  - id: ZY.55.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 六二
    text: 有孚发若，信以发志也。
    textTrad: 有孚發若，信以發志也。
    reviewStatus: imported
  - id: ZY.55.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 九三
    text: 丰其沛，不可大事也。折其右肱，终不可用也。
    textTrad: 豐其沛，不可大事也。折其右肱，終不可用也。
    reviewStatus: imported
  - id: ZY.55.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 九四
    text: 丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，吉；行也。
    textTrad: 豐其蔀，位不當也。日中見斗，幽不明也。遇其夷主，吉；行也。
    reviewStatus: imported
  - id: ZY.55.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 六五
    text: 六五之吉，有庆也。
    textTrad: 六五之吉，有慶也。
    reviewStatus: imported
  - id: ZY.55.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上六
    text: 丰其屋，天际翔也。窥其户，阒其无人，自藏也。
    textTrad: 豐其屋，天際翔也。窺其戶，闃其无人，自藏也。
    reviewStatus: imported
