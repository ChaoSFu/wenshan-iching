  - id: ZY.25.TUAN
    kind: tuan
    text: 无妄，刚自外来，而为主于内。动而健，刚中而应，大亨以正，天之命也。其匪正有眚，不利有攸往。无妄之往，何之矣？ 天命不佑，行矣哉？
    textTrad: 无妄，剛自外來，而為主於內。動而健，剛中而應，大亨以正，天之命也。其匪正有眚，不利有攸往。无妄之往，何之矣？ 天命不佑，行矣哉？
    reviewStatus: imported
  - id: ZY.25.XIANG
    kind: xiang
    text: 天下雷行，物与无妄；先王以茂对时，育万物。
    textTrad: 天下雷行，物與无妄；先王以茂對時，育萬物。
    reviewStatus: imported
