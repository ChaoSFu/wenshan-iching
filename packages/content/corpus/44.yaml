entries:
  - id: ZY.44.G
    kind: gua
    label: 姤
    text: 女壮，勿用取女。
    textTrad: 女壯，勿用取女。
    reviewStatus: imported
  - id: ZY.44.L1
    kind: yao
    line: 1
    label: 初六
    text: 系于金柅，贞吉，有攸往，见凶，羸豕，孚，蹢躅。
    textTrad: 系于金柅，貞吉，有攸往，見凶，羸豕，孚，蹢躅。
    reviewStatus: imported
  - id: ZY.44.L2
    kind: yao
    line: 2
    label: 九二
    text: 包有鱼，无咎，不利宾。
    textTrad: 包有魚，无咎，不利賓。
    reviewStatus: imported
  - id: ZY.44.L3
    kind: yao
    line: 3
    label: 九三
    text: 臀无肤，其行次且，厉，无大咎。
    textTrad: 臀无膚，其行次且，厲，无大咎。
    reviewStatus: imported
  - id: ZY.44.L4
    kind: yao
    line: 4
    label: 九四
    text: 包无鱼，起凶。
    textTrad: 包无魚，起凶。
    reviewStatus: imported
  - id: ZY.44.L5
    kind: yao
    line: 5
    label: 九五
    text: 以杞包瓜，含章，有陨自天。
    textTrad: 以杞包瓜，含章，有隕自天。
    reviewStatus: imported
  - id: ZY.44.L6
    kind: yao
    line: 6
    label: 上九
    text: 姤其角，吝，无咎。
    textTrad: 姤其角，吝，无咎。
    reviewStatus: imported
  - id: ZY.44.TUAN
    kind: tuan
    text: 姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！
    textTrad: 姤，遇也，柔遇剛也。勿用取女，不可與長也。天地相遇，品物咸章也。剛遇中正，天下大行也。姤之時義大矣哉！
    reviewStatus: imported
  - id: ZY.44.XIANG
    kind: xiang
    text: 天下有风，姤；后以施命诰四方。
    textTrad: 天下有風，姤；后以施命誥四方。
    reviewStatus: imported
  - id: ZY.44.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初六
    text: 系于金柅，柔道牵也。
    textTrad: 系于金柅，柔道牽也。
    reviewStatus: imported
  - id: ZY.44.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 九二
    text: 包有鱼，义不及宾也。
    textTrad: 包有魚，義不及賓也。
    reviewStatus: imported
  - id: ZY.44.L3.XIANG
    kind: xiaoxiang
    line: 3
    label: 九三
    text: 其行次且，行未牵也。
    textTrad: 其行次且，行未牽也。
    reviewStatus: imported
  - id: ZY.44.L4.XIANG
    kind: xiaoxiang
    line: 4
    label: 九四
    text: 无鱼之凶，远民也。
    textTrad: 无魚之凶，遠民也。
    reviewStatus: imported
  - id: ZY.44.L5.XIANG
    kind: xiaoxiang
    line: 5
    label: 九五
    text: 九五含章，中正也。有陨自天，志不舍命也。
    textTrad: 九五含章，中正也。有隕自天，志不舍命也。
    reviewStatus: imported
  - id: ZY.44.L6.XIANG
    kind: xiaoxiang
    line: 6
    label: 上九
    text: 姤其角，上穷吝也。
    textTrad: 姤其角，上窮吝也。
    reviewStatus: imported
