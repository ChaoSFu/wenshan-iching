  - id: ZY.20.TUAN
    kind: tuan
    text: 大观在上，顺而巽，中正以观天下。观，盥而不荐，有孚颙若，下观而化也。观天之神道，而四时不忒，圣人以神道设教，而天下服矣。
    textTrad: 大觀在上，順而巽，中正以觀天下。觀，盥而不薦，有孚顒若，下觀而化也。觀天之神道，而四時不忒，聖人以神道設教，而天下服矣。
    reviewStatus: imported
  - id: ZY.20.XIANG
    kind: xiang
    text: 风行地上，观；先王以省方，观民设教。
    textTrad: 風行地上，觀；先王以省方，觀民設教。
    reviewStatus: imported
