  - id: ZY.45.G
    kind: gua
    label: 萃
    text: 王假有庙，利见大人，亨。利贞。用大牲吉，利有攸往。
    textTrad: 王假有廟，利見大人，亨。利貞。用大牲吉，利有攸往。
    reviewStatus: imported
  - id: ZY.45.L1
    kind: yao
    line: 1
    label: 初六
    text: 有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。
    textTrad: 有孚不終，乃亂乃萃，若號一握為笑，勿恤，往无咎。
    reviewStatus: imported
  - id: ZY.45.L2
    kind: yao
    line: 2
    label: 六二
    text: 引吉，无咎，孚乃利用禴。
    textTrad: 引吉，无咎，孚乃利用禴。
    reviewStatus: imported
  - id: ZY.45.L3
    kind: yao
    line: 3
    label: 六三
    text: 萃如，嗟如，无攸利，往无咎，小吝。
    textTrad: 萃如，嗟如，无攸利，往无咎，小吝。
    reviewStatus: imported
  - id: ZY.45.L4
    kind: yao
