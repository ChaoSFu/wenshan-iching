    reviewStatus: imported
  - id: ZY.45.L5
    kind: yao
    line: 5
    label: 九五
    text: 萃有位，无咎。匪孚，元永贞，悔亡。
    textTrad: 萃有位，无咎。匪孚，元永貞，悔亡。
    reviewStatus: imported
  - id: ZY.45.L6
    kind: yao
    line: 6
    label: 上六
    text: 赍资涕洟，无咎。
    textTrad: 齎資涕洟，无咎。
    reviewStatus: imported
  - id: ZY.45.TUAN
    kind: tuan
    text: 萃，聚也；顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人亨，聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣。
    textTrad: 萃，聚也；順以說，剛中而應，故聚也。王假有廟，致孝享也。利見大人亨，聚以正也。用大牲吉，利有攸往，順天命也。觀其所聚，而天地萬物之情可見矣。
    reviewStatus: imported
  - id: ZY.45.XIANG
    kind: xiang
    text: 泽上于地，萃；君子以除戎器，戒不虞。
    textTrad: 澤上于地，萃；君子以除戎器，戒不虞。
    reviewStatus: imported
  - id: ZY.45.L1.XIANG
    kind: xiaoxiang
    line: 1
    label: 初六
    text: 乃乱乃萃，其志乱也。
    textTrad: 乃亂乃萃，其志亂也。
    reviewStatus: imported
  - id: ZY.45.L2.XIANG
    kind: xiaoxiang
    line: 2
    label: 六二
    text: 引吉无咎，中未变也。
