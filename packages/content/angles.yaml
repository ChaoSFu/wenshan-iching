# 观察角度（技术方案 5.5）：每条卦辞、爻辞标 1–2 个角度；主题配置按角度给出提示与反思问题。
version: 1
reviewStatus: draft
angles:
  - id: prepare
    name: 准备蓄势
    description: 时机未到或基础未稳，先积累，先弄清自己具备什么。
  - id: probe
    name: 试探接触
    description: 先用小步接触真实情况，听到反馈再决定。
  - id: persevere
    name: 坚守本分
    description: 方向没错，关键在持续，并守住原则。
  - id: restrain
    name: 节制收敛
    description: 收住冲动或过度投入，量力而行。
  - id: wait
    name: 等待时机
    description: 条件尚未成熟，耐心观察，不急于行动。
  - id: advance
    name: 主动推进
    description: 条件已经具备，可以主动迈出一步。
  - id: cooperate
    name: 求助合作
    description: 借助他人、沟通协作，比独自硬扛更好。
  - id: adjust
    name: 调整方向
    description: 原来的做法遇到阻碍，需要换个思路或节奏。
  - id: caution
    name: 防范风险
    description: 留意潜在的隐患，先设好底线。
  - id: reflect
    name: 反省自身
    description: 回头看看自己的期待、做法和情绪。
