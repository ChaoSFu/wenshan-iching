# 样例取自 PRD §5「解读样例与付费交付」
topic: career
title: 从后端转产品岗，用四周试一试
question: 我做后端，现岗位稳定，但考虑转产品岗。每周能抽三小时，目前没有面试。我该怎样用接下来四周试一试？
lines: [9, 7, 7, 7, 7, 7]
free:
  vernacular: 这句把早期阶段比作潜藏的龙。放在这个问题里，可以先想一想自己已经具备什么、还有什么需要在现实里验证。
  reflection: 你最想验证的是自己喜欢产品工作，还是已经具备申请产品岗的能力？
paid:
  situation: 你已经有后端项目经验，手里的验证时间是每周三小时。现在最不清楚的是目标岗位看重的能力，以及你对日常产品工作的实际兴趣。四周可以先用来补这两类信息。
  observation: 乾卦初九为先准备提供一个观察视角。《彖传》以「遇」解释姤，可以把它用作第二个视角，主动接触真实从业者，听听岗位里通常怎么作取舍。这一步能帮助你识别值得尝试的机会，并在投入前问清要求。
  observationCitations: [ZY.01.L1, ZY.44.TUAN]
  toVerify: 看内部转岗和外部面试各要求什么。先问清公司是否支持短期参与产品项目，再找两位目标岗位从业者了解真实的一周。
  sevenDayAction: 本周用两小时整理一个项目案例，写清用户需求、两个方案和你的取舍。余下一小时发出两次访谈邀请。下周按反馈把能力差距分成已具备、能补齐、仍未知三类，再决定是否开始投递。
  followupExample: 「我没有正式的产品项目，可以拿哪种后端项目当案例？」追问沿用本次卦象，可结合用户补充的项目情况调整行动。
