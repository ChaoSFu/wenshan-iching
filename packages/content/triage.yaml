# 免费阶段的本地分流词表（技术方案 5.6 L0）。文本只在浏览器里比对，不上传。
# action: crisis = 暂停解读并显示求助指引；notice = 提示边界，用户可以修改或按原问法继续。
version: 1
reviewStatus: draft
categories:
  - id: crisis
    action: crisis
    title: 先确认你的安全
    message: 你写的内容可能涉及人身安全。问山先暂停这次解读。如果你或身边的人现在有危险，请立即联系当地紧急服务，或者马上告诉一个你信任的人。
    keywords: [自杀, 自殺, 想死, 不想活, 活不下去, 轻生, 輕生, 结束生命, 結束生命, 了结自己, 了結自己, 割腕, 跳楼, 跳樓, 伤害自己, 傷害自己, 杀了他, 殺了他, 杀了她, 殺了她, 弄死, 家暴, 被打, 打我, 威胁我, 威脅我, 跟踪我, 跟蹤我]
  - id: health
    action: notice
    title: 健康问题请先听医生的意见
    message: 涉及疾病、诊断或用药的问题，问山不能代替医生的判断，也不提供付费报告。你仍然可以读卦象原文，但请把它当作反思的角度，并尽快向专业医疗人员咨询。
    keywords: [生病, 疾病, 病情, 癌, 肿瘤, 腫瘤, 诊断, 診斷, 确诊, 確診, 手术, 手術, 吃药, 吃藥, 用药, 用藥, 药物, 藥物, 治疗, 治療, 症状, 症狀, 抑郁症, 憂鬱症, 焦虑症, 焦慮症]
  - id: fertility
    action: notice
    title: 求子问题请先咨询专业人士
    message: 怀孕、备孕和求子相关的问题，问山首版不提供付费报告。卦象原文可以作为反思的角度，具体情况请向医生或专业机构咨询。
    keywords: [求子, 怀孕, 懷孕, 备孕, 備孕, 生孩子, 试管, 試管, 不孕]
  - id: legal
    action: notice
    title: 法律结果无法预测
    message: 问山不判断官司输赢。可以试着改问你能做的准备，例如「我现在该先整理哪些材料、去问哪类专业人士？」，具体问题请咨询律师。
    keywords: [官司, 诉讼, 訴訟, 起诉, 起訴, 判刑, 判决, 判決, 胜诉, 勝訴, 败诉, 敗訴, 被告, 坐牢]
  - id: investment
    action: notice
    title: 问山不预测投资收益
    message: 问山不判断涨跌、不预测收益。如果你在考虑一笔支出或小规模尝试，可以改问「我该怎样先小额验证，最多能承受多少损失？」。
    keywords: [股票, 炒股, 基金, 加密货币, 加密貨幣, 比特币, 比特幣, 币圈, 幣圈, 期货, 期貨, 外汇, 外匯, 涨不涨, 漲不漲, 会涨, 會漲, 会跌, 會跌, 收益率, 买哪只, 買哪隻, 彩票, 赌博, 賭博]
outcome:
  title: 换一个你能掌握的问法
  message: 这类问题的答案取决于别人或运气，卦象更适合帮你看清自己能做什么。你可以参考下面的改法，也可以保留原来的问法继续。
  # 子串匹配。"有机会复合吗""还会回来吗"这类问法同样取决于别人，与"会不会"同等处理
  patterns: [会不会, 會不會, 能不能, 有没有机会, 有沒有機會, 是不是, 爱不爱, 愛不愛, 喜不喜欢, 喜不喜歡, 复合吗, 復合嗎, 会回来吗, 會回來嗎, 有可能吗, 有可能嗎, 有戏吗, 有戲嗎]
multiQuestion:
  title: 一次先问一件事
  message: 看起来你写了不止一个问题。卦象一次只对应一件事，先选一个你最在意的吧。
