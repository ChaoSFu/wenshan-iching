id: love
version: 1
reviewStatus: draft
order: 1
name: 姻缘感情
tagline: 遇见合适的人、关系发展、复合
intents: [遇见合适的人, 关系发展, 复合, 沟通与相处]
examples:
  - 分开一个月，我还要主动联系吗？
  - 这段关系里，我该怎样表达自己的需要？
  - 想认识合适的人，我可以先从哪里开始？
clarifyHint: 想一想：你最想弄清的是自己该怎么做，还是对方在想什么？问山更适合帮你看前者。
reframeExample:
  from: 他会不会回来？
  to: 我要不要主动联系？怎样联系才不给对方压力？
contextFields:
  - key: willingness
    label: 双方现在是否愿意沟通
    primary: true
    placeholder: 例如：对方回消息但很冷淡；对方明确说暂时不想联系
  - key: duration
    label: 这段关系或这件事持续多久了
    placeholder: 例如：在一起两年，分开一个月
  - key: hope
    label: 你最希望的结果
    placeholder: 例如：先把话说清楚，不一定要复合
free:
  angleHints:
    default: 把注意力放回这段关系里你能做的部分：你的期待、你的表达和你的边界。
    prepare: 关系里的事急不来。可以先想清楚自己真正想要什么，再决定怎么开口。
    probe: 与其反复猜测，不如用一次轻松、低压力的交流，看看对方怎么回应。
    persevere: 如果方向是对的，稳定、真诚的相处比一次性的表态更重要。
    restrain: 把节奏放慢一点，不必一次说尽，也不必追着对方要答案。
    wait: 现在也许不是推进的时机，给彼此一些空间，留意关系里自然出现的变化。
    advance: 如果你已经想清楚了，可以主动表达一次，同时把选择权留给对方。
    cooperate: 可以和信任的朋友聊聊，或者和对方一起商量，而不是一个人揣测。
    adjust: 原来的相处方式也许需要调整，试着换一种表达，或换一个节奏。
    caution: 留意让你不安的信号，先守住自己的底线，再谈投入多少。
    reflect: 先回头看看自己在这段关系里的期待和习惯，答案可能就在这里。
  reflectionQuestions:
    default: [在这段关系里，你最希望改变的是哪一件具体的事？]
    prepare: [如果对方明天就回应你，你想好要说什么了吗？]
    probe: [有没有一种不给对方压力的方式，让你先了解对方现在的想法？]
    persevere: [相处中的哪些好习惯，是你愿意继续坚持的？]
    restrain: [你现在最想追问对方的那句话，能不能先放一放？]
    wait: [等待的这段时间里，你可以为自己做些什么？]
    advance: [如果只能主动做一件事，你会选哪一件？]
    cooperate: [身边有谁能听你说说这件事，给你一个不同的角度？]
    adjust: [过去哪种相处方式让你们都觉得累？]
    caution: [有哪些界限，是无论结果如何你都不想退让的？]
    reflect: [在这段关系里，你最常重复的一种反应是什么？]
report:
  mustVerify: [近期的实际互动, 双方的边界和意愿, 你自己的期待]
  deliverables: [一项尊重双方意愿的行动, 回看条件]
  actionStyle: 尊重对方意愿；不施压、不纠缠；七天内可完成
boundaryExamples:
  - { q: 他是不是不爱我了？, note: 不断言他人动机，改为看自己能做什么 }
  - { q: 我们什么时候结婚？, note: 不预测结果，改为看接下来怎么沟通 }
